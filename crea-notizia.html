<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatore notizie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{--green:#526548;--green-dark:#354130;--deep:#182018;--gold:#b39a55;--text:#202420;--muted:#687068;--line:#dfe4dc;--soft:#f3f5f1;--code:#111713;--success:#2f683a}
*{box-sizing:border-box}body{margin:0;background:#eef1ed;color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}.container{width:min(1180px,calc(100% - 40px));margin:auto}
.topbar{background:#fff;border-top:3px solid var(--deep);border-bottom:1px solid var(--line)}.topbar-inner{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:150px;height:55px;object-fit:contain;object-position:left}.page-tag{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.hero{background:var(--deep);color:#fff;padding:46px 0}.eyebrow{color:#d6bf7f;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.hero h1{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:clamp(38px,6vw,64px);line-height:1;margin:8px 0 10px}.hero p{margin:0;color:#bfc9bd;font-size:13px;line-height:1.7}
.workspace{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);gap:20px;padding:34px 0 54px}.tool-panel{background:#fff;border:1px solid var(--line);border-radius:8px}.panel-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.panel-head h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:27px;margin:0}.reset-btn,.copy-btn{height:40px;border-radius:4px;padding:0 14px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:8px;cursor:pointer}.reset-btn{border:1px solid var(--line);background:#fff;color:var(--deep)}.copy-btn{border:0;background:var(--green);color:#fff}.copy-btn:hover{background:var(--green-dark)}
.form-body{padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:800;text-transform:uppercase;color:#465046}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd1c9;border-radius:4px;background:#fff;padding:12px;outline:none}.field textarea{min-height:112px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(82,101,72,.09)}.check{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700}.check input{width:auto}.counter{text-align:right;color:#8a928a;font-size:9px}.generate-row{display:flex;justify-content:flex-end;margin-top:20px}.generate-btn{height:44px;border:0;border-radius:4px;background:var(--deep);color:#fff;padding:0 18px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:8px;cursor:pointer}.generate-btn:hover{background:var(--green)}
.result-column{display:grid;gap:20px;align-content:start}.preview-panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.preview-image{width:100%;aspect-ratio:16/8;object-fit:cover;background:#dfe4dc}.preview-copy{padding:24px}.preview-meta{display:flex;gap:9px;color:#7b847b;font-size:9px;font-weight:800;text-transform:uppercase}.preview-meta strong{color:var(--green)}.preview-copy h3{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:30px;line-height:1.12;margin:10px 0}.preview-copy p{color:var(--muted);font-size:12px;line-height:1.7;margin:0}.featured-badge{display:inline-flex;align-items:center;gap:6px;background:var(--deep);color:#fff;border-radius:3px;padding:6px 8px;font-size:9px;font-weight:800;text-transform:uppercase;margin-bottom:12px}
.code-panel{background:var(--code);border-radius:8px;overflow:hidden;color:#dce5da}.code-head{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:14px}.code-head strong{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:19px}.code-head .copy-btn{height:36px;background:#fff;color:var(--deep)}.code-output{display:block;width:100%;min-height:310px;border:0;resize:vertical;background:transparent;color:#dce5da;padding:18px;font:12px/1.65 Consolas,"Courier New",monospace;outline:none;white-space:pre}.status{min-height:18px;padding:0 18px 16px;color:#9ed6a7;font-size:10px}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.result-column{grid-template-columns:1fr 1fr}.code-output{min-height:360px}}@media(max-width:700px){.topbar-inner{height:68px}.page-tag{display:none}.workspace,.result-column,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.container{width:min(100% - 28px,1180px)}.panel-head,.form-body{padding-left:19px;padding-right:19px}.preview-copy{padding:20px}.generate-btn{width:100%;justify-content:center}}
.result-column{display:contents}.code-panel{grid-column:2;grid-row:1}.preview-heading{grid-column:1/-1;grid-row:2;margin-top:16px;padding-top:26px;border-top:1px solid var(--line)}.preview-heading small{color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.preview-heading h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:34px;line-height:1;margin:7px 0 0}.preview-panel{grid-column:1/-1;grid-row:3;justify-self:start;transition:.18s}.preview-panel.featured-view{width:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);background:var(--deep);color:#fff}.preview-panel.featured-view .preview-image{height:100%;min-height:390px;aspect-ratio:auto}.preview-panel.featured-view .preview-copy{padding:38px;display:flex;flex-direction:column;justify-content:center}.preview-panel.featured-view .preview-meta{color:#aeb8ad}.preview-panel.featured-view .preview-meta strong{color:#d6bf7f}.preview-panel.featured-view .preview-copy h3{font-size:clamp(32px,4vw,46px);color:#fff}.preview-panel.featured-view .preview-copy p{color:#cbd3c9;font-size:14px}.preview-panel.standard-view{width:min(390px,100%);display:block;background:#fff;color:var(--text)}.preview-panel.standard-view .preview-image{aspect-ratio:16/10}.preview-panel.standard-view .preview-copy{padding:22px}.preview-panel.standard-view .preview-copy h3{font-size:25px}@media(max-width:900px){.code-panel{grid-column:1;grid-row:2}.preview-heading{grid-row:3}.preview-panel{grid-row:4}.preview-panel.featured-view{grid-template-columns:1fr}.preview-panel.featured-view .preview-image{min-height:280px;aspect-ratio:16/9}.preview-panel.featured-view .preview-copy{padding:28px 24px}}</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner"><div class="brand"><img src="https://it.wikipedia.org/wiki/Special:Redirect/file/Logo%20Esercito%20Italiano%20stella.svg" alt="Logo Esercito Italiano"></div><span class="page-tag">Strumento editoriale riservato</span></div></header>
<section class="hero"><div class="container"><div class="eyebrow">Portale · Gestione contenuti</div><h1>Generatore notizie</h1><p>Crea il blocco dati compatibile con il portale.</p></div></section>

<main class="container workspace">
<section class="tool-panel"><header class="panel-head"><h2>Contenuto</h2><button class="reset-btn" id="resetForm" type="button"><i class="fa-solid fa-rotate-left"></i> Reimposta</button></header><form class="form-body" id="newsBuilder">
<div class="form-grid">
<div class="field full"><label for="title">Titolo</label><input id="title" maxlength="110" required></div>
<div class="field"><label for="category">Categoria</label><select id="category"><option>Comunicati</option><option>Attività</option><option>Avvisi</option></select></div>
<div class="field"><label for="date">Data</label><input id="date" type="date" required></div>
<div class="field full"><label for="image">URL immagine</label><input id="image" type="url" placeholder="https://..." required></div>
<div class="field full"><label for="source">Fonte immagine</label><input id="source" type="url" placeholder="https://..."></div>
<div class="field full"><label for="summary">Sommario</label><textarea id="summary" maxlength="280" required></textarea><div class="counter"><span id="summaryCount">0</span>/280</div></div>
<div class="field full"><label for="body">Testo completo</label><textarea id="body" maxlength="4000" required></textarea><div class="counter"><span id="bodyCount">0</span>/4000</div></div>
<label class="check field full"><input id="featured" type="checkbox"> Notizia in evidenza</label>
</div><div class="generate-row"><button class="generate-btn" type="submit"><i class="fa-solid fa-code"></i> Genera codice</button></div>
</form></section>

<aside class="result-column"><div class="preview-heading"><small>Risultato finale</small><h2>Anteprima nel portale</h2></div><section class="preview-panel standard-view" id="previewPanel"><img class="preview-image" id="previewImage" src="assets/reparti/fante.jpg" alt=""><div class="preview-copy"><span class="featured-badge" id="previewBadge"><i class="fa-solid fa-thumbtack"></i> In evidenza</span><div class="preview-meta"><strong id="previewCategory">Comunicati</strong><span id="previewDate"></span></div><h3 id="previewTitle">Titolo della notizia</h3><p id="previewSummary">Il sommario apparirà qui.</p></div></section>
<section class="code-panel"><header class="code-head"><strong>Codice per portale.html</strong><button class="copy-btn" id="copyCode" type="button"><i class="fa-solid fa-copy"></i> Copia</button></header><textarea class="code-output" id="codeOutput" readonly spellcheck="false"></textarea><div class="status" id="copyStatus" role="status"></div></section></aside>
</main>

<script>
const $=id=>document.getElementById(id);
function slugify(value){return value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||`notizia-${Date.now()}`}
function data(){return{id:slugify($('title').value),title:$('title').value.trim(),category:$('category').value,date:$('date').value,image:$('image').value.trim(),source:$('source').value.trim()||$('image').value.trim(),summary:$('summary').value.trim(),body:$('body').value.trim(),featured:$('featured').checked}}
function codeFor(item){return JSON.stringify(item,null,2)+','}
function dateIt(value){if(!value)return'';return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(value+'T12:00:00'))}
function update(){const item=data();$('previewTitle').textContent=item.title||'Titolo della notizia';$('previewCategory').textContent=item.category;$('previewDate').textContent=dateIt(item.date);$('previewSummary').textContent=item.summary||'Il sommario apparirà qui.';$('previewBadge').style.display=item.featured?'inline-flex':'none';$('previewPanel').className=`preview-panel ${item.featured?'featured-view':'standard-view'}`;$('previewImage').src=item.image||'assets/reparti/fante.jpg';$('codeOutput').value=codeFor(item);$('summaryCount').textContent=$('summary').value.length;$('bodyCount').textContent=$('body').value.length;$('copyStatus').textContent=''}
async function copyCode(){try{await navigator.clipboard.writeText($('codeOutput').value);$('copyStatus').textContent='Codice copiato negli appunti.';$('copyCode').innerHTML='<i class="fa-solid fa-check"></i> Copiato'}catch{$('codeOutput').select();document.execCommand('copy');$('copyStatus').textContent='Codice copiato negli appunti.'}setTimeout(()=>{$('copyCode').innerHTML='<i class="fa-solid fa-copy"></i> Copia'},1600)}
$('newsBuilder').addEventListener('input',update);$('newsBuilder').addEventListener('change',update);$('newsBuilder').onsubmit=e=>{e.preventDefault();update();copyCode()};$('copyCode').onclick=copyCode;$('previewImage').onerror=()=>{$('previewImage').src='assets/reparti/fante.jpg'};
$('resetForm').onclick=()=>{$('newsBuilder').reset();$('date').value=new Date().toISOString().slice(0,10);update()};$('date').value=new Date().toISOString().slice(0,10);update();
</script>
</body>
</html>
